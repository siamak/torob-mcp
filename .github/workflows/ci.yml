name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install scripts are disabled repo-wide via the pnpm onlyBuiltDependencies allowlist.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint and format
        run: pnpm exec oxlint . && pnpm exec oxfmt --check

      - name: Typecheck
        run: pnpm -r typecheck

      # Builds first: the e2e tests drive the real dist/bin.mjs.
      - name: Build
        run: pnpm build

      - name: Test with coverage gates
        run: pnpm exec vitest run --coverage

      # The Inspector is how a human checks this server by hand; running its CLI here catches a
      # broken bin entry or bundle that the in-process tests cannot see. Makes no upstream request.
      - name: MCP Inspector (CLI mode)
        run: pnpm inspect:cli

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # Builds the real image on every PR: the runtime stage is distroless and ships its own
      # node_modules, and a mistake there is invisible until someone runs the container.
      - name: Build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          tags: torob-mcp:ci

      - name: Start it and check health
        run: |
          docker run -d --name torob-ci --read-only -p 3000:3000 \
            -e TOROB_AUTH_TOKEN=ci-token-not-a-secret-000 torob-mcp:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "healthy"; docker rm -f torob-ci; exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"; docker logs torob-ci; exit 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: results.sarif
