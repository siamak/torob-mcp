name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec oxlint . && pnpm exec oxfmt --check
      - run: pnpm -r typecheck
      - run: pnpm build
      - run: pnpm exec vitest run --coverage
      - run: pnpm audit --audit-level=high

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted publishing: npm mints a short-lived credential from this token, so no long-lived
      # NPM_TOKEN exists in the repository to be stolen.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      # v7+ does not inject a dummy NODE_AUTH_TOKEN, which blocks npm OIDC trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Generate CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.json --omit dev

      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships an older npm).
      - name: Publish with provenance
        run: |
          npm install -g npm@latest
          unset NODE_AUTH_TOKEN
          pnpm publish --filter torob-mcp --access public --provenance --no-git-checks

      - name: GitHub release with SBOM
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: sbom.json
          generate_release_notes: true

  docker:
    name: Build, scan and sign the image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load locally first so Trivy scans exactly what we would push.
      - name: Build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          tags: torob-mcp:scan

      # v0.29.0 pulled deleted setup-trivy@v0.2.2 (post-compromise yank). v0.36.0 pins setup-trivy@v0.2.6.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: torob-mcp:scan
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/torob-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/torob-mcp:latest

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign the image keylessly
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/torob-mcp@${{ steps.push.outputs.digest }}
